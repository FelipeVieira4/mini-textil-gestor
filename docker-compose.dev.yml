#version: '3.8'

services:
  back-end:
    user: "${HOST_UID}:${HOST_GID}"
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: api_service_dev
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5005:5005"
    volumes:
      - .:/app:Z
      - maven-repo:/home/dev/.m2
      - vaadin-cache:/home/dev/.vaadin
    environment:
      - HOME=/home/dev
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    networks:
      - backend
    develop:
      watch:
        - action: sync
          path: ./src/main/resources
          target: /app/src/main/resources
        - action: rebuild
          path: ./pom.xml

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    ports:
      - "127.0.0.1:6050:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:
  maven-repo:
  vaadin-cache:

networks:
  backend:
    driver: bridge